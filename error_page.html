<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Error - Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 50px 30px;
            box-shadow: 0 20px 40px rgba(255, 165, 0, 0.1);
            border: 1px solid rgba(255, 165, 0, 0.2);
        }

        /* Warna oranye sebagai tema utama */
        .error-code {
            font-size: 120px;
            font-weight: 800;
            color: #FF8C00; /* Oranye tua */
            margin-bottom: 20px;
            text-shadow: 3px 3px 0 rgba(255, 140, 0, 0.1);
            line-height: 1;
        }

        .error-title {
            font-size: 32px;
            font-weight: 700;
            color: #E67E00;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .error-details {
            background: #FFF8F0;
            border-left: 4px solid #FF8C00;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: left;
            color: #666;
            font-size: 14px;
        }

        .btn-home {
            display: inline-block;
            background: #FF8C00;
            color: white;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn-home:hover {
            background: #E67E00;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 140, 0, 0.4);
        }

        .help-text {
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }

        /* Animasi untuk ikon */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .emoji-icon {
            font-size: 80px;
            display: inline-block;
            animation: pulse 2s ease infinite;
            margin-bottom: 10px;
        }

        /* Responsif */
        @media (max-width: 480px) {
            .error-container {
                padding: 30px 20px;
            }
            .error-code {
                font-size: 80px;
            }
            .error-title {
                font-size: 24px;
            }
            .error-message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="emoji-icon" id="errorEmoji">⚠️</div>
        <div class="error-code" id="errorCode">404</div>
        <div class="error-title" id="errorTitle">Halaman Tidak Ditemukan</div>
        <div class="error-message" id="errorMessage">
            Maaf, halaman yang Anda cari sedang tidak dapat diakses atau telah dipindahkan.
        </div>
        <div class="error-details" id="errorDetails">
            📍 URL: <span id="currentUrl">-</span><br>
            🕒 Waktu: <span id="currentTime">-</span>
        </div>
        <a href="/" class="btn-home">🏠 Kembali ke Beranda</a>
        <div class="help-text">
            Jika masalah berlanjut, hubungi admin website.
        </div>
    </div>

    <script>
        // Fungsi untuk mendeteksi jenis error dari URL parameter atau status
        function getErrorInfo() {
            const path = window.location.pathname;
            let code = '404';
            let title = 'Halaman Tidak Ditemukan';
            let message = 'Maaf, halaman yang Anda cari sedang tidak dapat diakses atau telah dipindahkan.';
            let emoji = '🔍';

            // Deteksi dari URL (jika menggunakan parameter error)
            const urlParams = new URLSearchParams(window.location.search);
            const errorParam = urlParams.get('error');
            
            if (errorParam) {
                code = errorParam;
            } else if (path.includes('403')) {
                code = '403';
            } else if (path.includes('404')) {
                code = '404';
            } else if (path.includes('500')) {
                code = '500';
            }

            // Set konten berdasarkan kode error
            switch(code) {
                case '403':
                    title = 'Akses Dilarang';
                    message = 'Anda tidak memiliki izin untuk mengakses halaman ini.';
                    emoji = '🚫';
                    break;
                case '404':
                    title = 'Halaman Tidak Ditemukan';
                    message = 'Halaman yang Anda cari tidak tersedia atau telah dipindahkan.';
                    emoji = '🔍';
                    break;
                case '500':
                    title = 'Kesalahan Server Internal';
                    message = 'Terjadi masalah pada server. Tim teknis sedang bekerja untuk memperbaikinya.';
                    emoji = '⚙️';
                    break;
                default:
                    title = 'Terjadi Kesalahan';
                    message = 'Maaf, terjadi kesalahan yang tidak diketahui.';
                    emoji = '⚠️';
            }

            return { code, title, message, emoji };
        }

        // Update tampilan berdasarkan error
        const errorInfo = getErrorInfo();
        document.getElementById('errorCode').textContent = errorInfo.code;
        document.getElementById('errorTitle').textContent = errorInfo.title;
        document.getElementById('errorMessage').textContent = errorInfo.message;
        document.getElementById('errorEmoji').textContent = errorInfo.emoji;
        
        // Tampilkan URL dan waktu saat ini
        document.getElementById('currentUrl').textContent = window.location.href;
        const now = new Date();
        document.getElementById('currentTime').textContent = now.toLocaleString('id-ID');
    </script>
</body>
</html>
