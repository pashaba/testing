name: Extract ZIP Files Automatically

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract all ZIP files
        run: |
          # Cari semua file .zip di repository
          for zipfile in $(find . -name "*.zip" -type f); do
            echo "📦 Extracting: $zipfile"
            
            # Dapatkan direktori tempat ZIP berada
            zipdir=$(dirname "$zipfile")
            
            # Ekstrak ZIP ke direktori yang sama
            unzip -o "$zipfile" -d "$zipdir"
            
            # Hapus file ZIP setelah ekstrak
            rm "$zipfile"
            
            echo "✅ Extracted and removed: $zipfile"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-extract ZIP files [skip ci]" || echo "No changes to commit"
          git push
