<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Raw Fetch</title>
<style>
body{
    background:#111;
    color:#0f0;
    font-family:monospace;
    padding:20px;
}
pre{
    white-space:pre-wrap;
    word-break:break-word;
}
</style>
</head>
<body>

<button onclick="getRaw()">Fetch Raw</button>

<pre id="output">Belum ada data...</pre>

<script>
const PANEL = "https://private.pterokudesu.web.id";
const TOKEN = "MASUKKAN_PTLC_KAMU";

async function getRaw(){
    const res = await fetch(`${PANEL}/api/client`,{
        headers:{
            Authorization:`Bearer ${TOKEN}`,
            Accept:"Application/vnd.pterodactyl.v1+json"
        }
    });

    const raw = await res.text();

    document.getElementById("output").textContent = raw;
}
</script>

</body>
</html>
